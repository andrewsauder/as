; The PHP settings of an AS application image.
;
; The php:8.4-fpm base image ships no php.ini, so every setting not named here is PHP's
; compiled default. This file replaces the var/srv/app.<environment>/php.ini files that the
; IIS servers use, and keeps their values where a container allows them.

; --- errors --------------------------------------------------------------------
; Errors go to the log, never into a page. stderr is the container's output: gcgov/deploy
; keeps it in the host's journal across deploys, and the host forwards the journal to
; Blumira. zz-as.conf sets the same path for the FPM workers.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

; A stack trace in the log otherwise shows the arguments of each call, and new PDO(...)
; takes the database password as one of them.
zend.exception_ignore_args = On

expose_php = Off

; --- what AS and its applications expect, as on IIS ------------------------------
; AS sends headers, such as a status code from httpError(), after a template prints. The
; IIS php.ini buffers 4096 bytes, which makes that work. The compiled default buffers
; nothing.
output_buffering = 4096
short_open_tag = Off
request_order = "GP"
date.timezone = America/New_York

; --- opcache --------------------------------------------------------------------
; A deploy replaces the container rather than the files in it, so the code cannot change
; under a running process, and checking file times is wasted work.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; --- limits ---------------------------------------------------------------------
; nginx accepts a 1024 MB body. post_max_size and upload_max_filesize match it, or PHP
; rejects a large upload after the whole body has crossed the wire.
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
post_max_size = 1024M
upload_max_filesize = 1024M
max_file_uploads = 50

; --- sessions -------------------------------------------------------------------
; Inside the container: a deploy or a restart signs every user out. AS keeps its merged
; configuration, secrets included, in the session, so a session that outlived a rotated
; secret would keep using the old value. AS_SESSION_NAME sets the session cookie name.
session.save_handler = files
session.save_path = /var/lib/php/sessions
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

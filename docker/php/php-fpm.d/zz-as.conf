; The PHP-FPM pool of an AS application image. The Dockerfile deletes the base image's
; www.conf, which sets `user` and `group`. Only a root master process can act on those, and
; this image runs FPM as www-data from the start, so they would only warn on every start.
;
; The base image's docker.conf and zz-docker.conf still apply: the master writes its log
; to stderr, and the pool listens on port 9000. This file sorts after both.

[global]
; The longest line FPM passes on from a worker. The base image sets 8192, which splits a
; long stack trace into pieces.
log_limit = 65536

[www]
; No listen.allowed_clients: nginx connects from its own container address. Only nginx
; shares the stack's private network with this container, and that is the boundary.

; Static, because the container has a fixed memory limit. 8 workers x memory_limit 256M
; fits in a 3g container limit. Change the two together, never one alone.
pm = static
pm.max_children = 8
pm.max_requests = 1000

; Worker errors go to the container's output, without FPM's prefix on each line.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; AS reads AS_CONFIG_LOCAL_FILE, AS_SESSION_NAME and the other settings from the
; environment. Without this, FPM hides the environment from PHP.
clear_env = no
